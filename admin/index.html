<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Resolve ./app.js, ./lib/*, ./data/* against /admin/ even when the page is
     served at /admin (no trailing slash) — otherwise assets 404 and the page
     renders blank. -->
<base href="/admin/">
<title>ARSO Console — Arasya</title>
<style>
  :root{
    --ink:#0B0F1A; --panel:#111726; --panel-2:#161d2e; --line:#232c40;
    --muted:#8595ad; --text:#E7ECF5; --blue:#2E6FE0; --blue-2:#1452C4;
    --good:#2fbf71; --warn:#e8b13a; --bad:#e5544b; --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--text);font:14px/1.5 'Inter Tight',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  code,.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
  button{font:inherit;cursor:pointer}
  ::selection{background:var(--blue);color:#fff}

  .app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
  /* ── sidebar ── */
  .side{background:#0a0e18;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:4px}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 14px}
  .brand .logo{width:28px;height:28px;border-radius:8px;background:var(--ink);display:grid;place-items:center;border:1px solid var(--line)}
  .brand b{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.01em;font-size:15px}
  .brand small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .nav button{display:flex;align-items:center;gap:10px;justify-content:space-between;background:transparent;border:none;color:var(--muted);text-align:left;padding:9px 10px;border-radius:9px;font-weight:600;font-size:13.5px}
  .nav button .k{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4b5771;border:1px solid var(--line);border-radius:5px;padding:0 5px}
  .nav button:hover{background:var(--panel);color:var(--text)}
  .nav button.on{background:var(--blue-2);color:#fff}
  .nav button.on .k{color:#cfe0ff;border-color:#3d6ad0}
  .side .spacer{flex:1}
  .role-box{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel)}
  .role-box label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-family:'IBM Plex Mono',monospace}
  .role-box select{width:100%;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-weight:600}
  .role-box p{margin:8px 0 0;font-size:11px;color:var(--muted);line-height:1.4}
  .reset{margin-top:8px;width:100%;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px;font-size:12px}
  .reset:hover{color:var(--bad);border-color:var(--bad)}

  /* ── main ── */
  .main{padding:22px 26px;overflow:auto}
  .demo-banner{background:linear-gradient(90deg,rgba(232,177,58,.14),transparent);border:1px solid rgba(232,177,58,.35);color:#f0c765;border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:18px;display:flex;gap:8px;align-items:center}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .grid{display:grid;gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .card h3{margin:0 0 12px;font-size:13px;letter-spacing:.02em;font-weight:700}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.04em}
  .muted{color:var(--muted)} .mono{font-variant-numeric:tabular-nums}
  input,select,textarea{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font:inherit;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
  label.fld{display:block} label.fld > span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-family:'IBM Plex Mono',monospace}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-weight:600}
  .btn:hover{background:#2560c8}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--blue);color:#cfe0ff}
  .btn.good{background:var(--good)} .btn.bad{background:var(--bad)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--muted);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;font-weight:600}
  tr:last-child td{border-bottom:none}

  /* breakdown */
  .brk{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel-2)}
  .brk .ln{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line)}
  .brk .ln:last-child{border-bottom:none}
  .brk .tot{background:linear-gradient(135deg,#0d1424,#182136);font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;padding:14px}
  .incl{color:var(--good);font-size:12px;font-weight:600}
  .margin-box{margin-top:12px;border:1px dashed var(--line);border-radius:10px;padding:11px 13px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .locked{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:7px}

  /* kanban */
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;align-items:start}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:80px}
  .col > .h{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin:2px 4px 10px}
  .bkg{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab}
  .bkg:active{cursor:grabbing}
  .bkg.drag{opacity:.4}
  .col.over{border-color:var(--blue);background:#12203a}
  .bkg .c{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
  .bkg .who{font-weight:700;margin:3px 0}
  .bkg .meta{font-size:12px;color:var(--muted)}

  .heat td.m{font-weight:700;font-variant-numeric:tabular-nums}
  .alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);margin-bottom:8px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-size:13px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:60;max-width:520px}
  .toast.good{border-color:var(--good)} .toast.bad{border-color:var(--bad)}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(4,7,14,.66);display:grid;place-items:center;z-index:50;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(460px,94vw)}
  .modal h3{margin:0 0 4px;font-size:16px}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="logo"><svg width="16" height="16" viewBox="0 0 64 64"><path d="M20 46 L32 16 L44 46" fill="none" stroke="#2E6FE0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="25" y1="37" x2="39" y2="37" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg></span>
      <div><b>ARSO</b><small>Console</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <div class="role-box">
      <label>Peran (RBAC)</label>
      <select id="role"></select>
      <p id="roleDesc"></p>
    </div>
    <button class="reset" id="reset">Reset data demo</button>
  </aside>

  <main class="main">
    <div class="demo-banner">⚠ <span><b>Data demo.</b> Angka harga/biaya di sini ilustratif — bukan tarif Arasya terkonfirmasi. Engine &amp; alur kerjanya nyata; inputnya fixture. Persist di browser (localStorage).</span></div>
    <div id="view"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
